version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=warehouse;User=admin;Password=adminPSW123***;
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Labas123***
      MYSQL_DATABASE: warehouse
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminPSW123***
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
